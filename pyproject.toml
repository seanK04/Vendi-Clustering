[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "vendi-clustering"
version = "0.1.0.dev0"
description = "Diversity-preserving topic merging with the Vendi Score."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "Sean Kim" },
    { name = "Adji Bousso Dieng" },
]
dependencies = [
    "numpy>=1.20",
    "scipy>=1.7",
    "scikit-learn>=1.0",
]

[project.optional-dependencies]
# Pinned to the range the published results were produced under (0.17.3).
bertopic = ["bertopic>=0.17,<0.18"]
eval = ["gensim>=4.3", "vendi-score>=0.0.3"]
progress = ["tqdm>=4.41"]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
